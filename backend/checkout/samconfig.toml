# Deploy parameters for the checkout stack. Secrets are NEVER stored here —
# they live in the gss/checkout Secrets Manager secret; the stack takes only
# its ARN (the old StripeSecretKey/StripeWebhookSecret CFN params were removed
# in the Secrets Manager cutover):
#   sam build && sam deploy --parameter-overrides \
#     "CheckoutSecretsArn=arn:aws:secretsmanager:us-east-2:...:secret:gss/checkout-..." \
#     "PriceMonthly=price_..." "PriceAnnual=price_..." \
#     "CheckoutDomainName=checkout.groundstatesociety.com" "CheckoutCertArn=arn:aws:acm:..." \
#     "SiteUrl=https://groundstatesociety.com" "AlarmEmail=..." "ReservedConcurrency=-1"
version = 0.1

[default.deploy.parameters]
stack_name = "gss-stripe-checkout"
region = "us-east-2"
# Pin the account: this stack lives in the GSS account (659). Without this, a
# `sam deploy` uses the default AWS profile and can target the wrong account
# (e.g. the stale pre-migration 205 stack).
profile = "ground-state"
resolve_s3 = true
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
